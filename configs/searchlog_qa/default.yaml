_base_: ../_base_/default.yaml

# ── DeepSeek 后端（OpenAI 兼容）────────────────────────────
model:
  optimizer: deepseek-v4-flash
  target: deepseek-v4-flash
  reasoning_effort: ""      # DeepSeek 不支持 reasoning_effort，置空
  # 使用环境变量 DEEPSEEK_API_KEY + DEEPSEEK_BASE_URL
  # 这些会通过 AZURE_OPENAI_AUTH_MODE=openai_compatible 模式自动处理

# ── 训练参数 ───────────────────────────────────────────────
train:
  num_epochs: 4
  train_size: 0          # 0 = 使用全部训练集
  batch_size: 8           # 每条日志数据量不大，小 batch
  seed: 42

# ── 反思参数 ───────────────────────────────────────────────
gradient:
  minibatch_size: 4       # 小 minibatch，适合 30+ 条训练数据
  merge_batch_size: 4
  analyst_workers: 4
  failure_only: false

# ── 优化器参数 ─────────────────────────────────────────────
optimizer:
  learning_rate: 4
  lr_scheduler: cosine
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: true
  use_meta_skill: true
  use_skill_aware_reflection: false

# ── 评估 ───────────────────────────────────────────────────
evaluation:
  use_gate: true
  gate_metric: soft        # 数据量小时用 soft 指标更敏感
  sel_env_num: 0
  test_env_num: 0
  eval_test: true

# ── 环境 ───────────────────────────────────────────────────
env:
  name: searchlog_qa
  skill_init: skillopt/envs/searchlog_qa/skills/initial.md
  split_mode: split_dir
  split_dir: data/searchlog_qa
  workers: 8
  max_completion_tokens: 16384
  exec_timeout: 120
